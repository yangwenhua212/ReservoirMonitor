<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 水库水文数据监测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-key"></i> 修改密码</h1>
                <p>请填写以下信息修改您的密码</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('change_password') }}" class="auth-form">
                <div class="form-group">
                    <label for="old_password"><i class="fas fa-lock"></i> 当前密码 *</label>
                    <input type="password" id="old_password" name="old_password" required placeholder="请输入当前密码">
                </div>

                <div class="form-group">
                    <label for="new_password"><i class="fas fa-lock"></i> 新密码 *</label>
                    <input type="password" id="new_password" name="new_password" required placeholder="请输入新密码（至少6位）"
                        minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-lock"></i> 确认新密码 *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入新密码"
                        minlength="6">
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-save"></i> 保存修改
                    </button>
                </div>

                <div class="form-group text-center">
                    <p><a href="{{ url_for('profile') }}">返回个人资料</a></p>
                    <p><a href="{{ url_for('index') }}">返回首页</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
