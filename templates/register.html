<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 水库水文数据监测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-user-plus"></i> 用户注册</h1>
                <p>创建新账户以使用系统功能</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}" class="auth-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> 用户名 *</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名">
                </div>

                <div class="form-group">
                    <label for="full_name"><i class="fas fa-id-card"></i> 真实姓名</label>
                    <input type="text" id="full_name" name="full_name" placeholder="请输入您的真实姓名">
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> 电子邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入电子邮箱">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> 密码 *</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码（至少6位）"
                        minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-lock"></i> 确认密码 *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码"
                        minlength="6">
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-user-plus"></i> 注册
                    </button>
                </div>

                <div class="form-group text-center">
                    <p>已有账户？ <a href="{{ url_for('login') }}">立即登录</a></p>
                    <p><a href="{{ url_for('index') }}">返回首页</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
