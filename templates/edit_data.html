{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-white">
                    <h5 class="mb-0"><i class="fas fa-edit"></i> 编辑水文数据</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">水库名称 *</label>
                                <input type="text" class="form-control" name="reservoir_name" value="{{ data[5] }}"
                                    required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">监测时间</label>
                                <input type="text" class="form-control" value="{{ data[1] }}" readonly>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">水位 (米) *</label>
                                <input type="number" step="0.1" class="form-control" name="water_level"
                                    value="{{ data[2] }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">降雨量 (毫米) *</label>
                                <input type="number" step="0.1" class="form-control" name="rainfall"
                                    value="{{ data[3] }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">流量 (m³/s) *</label>
                                <input type="number" step="0.1" class="form-control" name="flow_rate"
                                    value="{{ data[4] }}" required>
                            </div>
                        </div>

                        <!-- 新增：备注字段 -->
                        <div class="mb-3">
                            <label class="form-label">备注信息</label>
                            <textarea class="form-control" name="remarks" rows="3"
                                placeholder="可输入数据相关的备注信息...">{{ data[6] if data[6] else '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('show_data') }}" class="btn btn-outline-secondary me-md-2">
                                <i class="fas fa-times"></i> 取消
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i> 更新数据
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
